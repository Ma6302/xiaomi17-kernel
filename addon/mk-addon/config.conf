# Ma6302 Kernel Addon - user config
# 改完这个文件后：重启生效，或 su -c /data/adb/modules/mk-addon/apply.sh 立即生效
# 语法：KEY=VALUE   （# 开头为注释；值不要加引号）

# ---- 总开关 ----
MASTER_ENABLE=1

# ---- 内核身份守卫 ----
# 1 = 只在「本项目构建的内核」上工作；刷回原厂/别家内核时自动停止所有调参
# 0 = 关闭守卫（不推荐）
KERNEL_GUARD=1
# 运行内核版本串里必须包含这个标记才算「我们的内核」
# 我们的内核 uname -r = 6.12.69-android16-6-4k-Ma6302
EXPECTED_KERNEL_TAG=Ma6302
# 非我方内核时，是否仍做「只读数据收集」（0 = 完全停止工作，默认）
GUARD_COLLECT_ON_FOREIGN=0
# 强制跳过守卫（仅 apply.sh --force 临时使用，不要写进这里）

# ---- zram / 压缩算法 ----
ZRAM_ENABLE=1
# 压缩算法： lzo | lzo-rle | lz4 | zstd   （keep=不改）
# 注意：切换算法会 reset zram（丢弃现有 swap 压缩页），有进程被杀风险
ZRAM_ALGO=lz4
# zram 大小（GB）。0 = 保持现状
ZRAM_DISKSIZE_GB=0
# 是否在切换算法时自动 swapoff/swapon（1=是）
ZRAM_REMOUNT_SWAP=1
# reset 后是否自动 mkswap（必须，否则 swapon 失败）
ZRAM_MKSWAP=1

# ---- 小米 zgroup / xswapd / mctrl 研究开关（默认全 0，保持与出厂一致）----
# 详见 逆向-zram回写机制-修正版终稿-20261009.md
# enable 控制【xswapd 主动回写循环】；被动路径（进程退出释放）不受它控制，
# drop_wb 仍会增长。原厂默认 0 = MIUI 上层 extm 主导，内核侧保守关闭。
XSWAPD_ENABLE=0
# 0=不写；>=101 才会让自动回写条件成立
MCTRL_COMP_RATIO=0
# 0=不写；<=100
MCTRL_WB_RATIO=0

# ---- 内存 VM ----
SWAPPINESS=100
VFS_CACHE_PRESSURE=100
COMPACTION_PROACTIVENESS=20
WATERMARK_BOOST_FACTOR=0
EXTFRAG_THRESHOLD=1000
# 0 = 不写（保持 ROM 默认）
DIRTY_RATIO=0

# ---- IO ----
# keep = 不改；或写具体调度器名（none / adios / mq-deadline ...）
IO_SCHEDULER=keep
# 0 = 不改（保持 ROM 默认 = 512，UFS4 下更优）
# 注：Nanally 用 128，但那是它的取舍；我们保持原厂 512 以免降低顺序读性能
READ_AHEAD_KB=0

# ---- 网络（默认关闭）----
# 1 = 启用 Nanally 同款 TCP 调优（12 项）
NET_TUNE=0
# 拥塞控制： keep=不改 | cubic | bbr（需内核支持）
TCP_CC=keep

# ---- WALT 调度库标记（游戏/Flutter 应用负载追踪）----
# 1 = 启用（写 /proc/sys/walt/sched_lib_name）
WALT_TUNE=0
# 逗号分隔的库名列表；0 = 不改
WALT_SCHED_LIB=libunity.so,libfb.so,libflutter.so,libapp.so

# ---- cpuset 亲和（后台省电）----
# 1 = 启用
CPUSET_TUNE=0
# 后台组 CPU 列表： auto = 小核（自动探测 cluster_cpus_list）
CPUSET_BACKGROUND_CPUS=auto
# system-background 组： auto = 全部 CPU
CPUSET_SYSTEM_BG_CPUS=auto

# ---- 数据收集 ----
COLLECT_ON_BOOT=1
COLLECT_DIR=/data/local/mk-data
KEEP_SNAPSHOTS=60

# ---- 内核日常记录仪（以内核版本+参数标注的日常采样）----
# 设计：非充电 且 非游戏 时记录；插充电器 → 把刚结束的那段归档到工作区；拔充电器 → 开始新段
# 1 = 开机自动启动
RECORDER_ENABLE=1
# 采样间隔（秒）
RECORDER_INTERVAL=60
# 游戏检测周期（秒），默认 180 = 3 分钟（1.2.2 新增）
#   说明：检测一次 = 一次 dumpsys（实测 12ms）。周期越短越不容易漏掉短游戏，
#        但开销略增。之前是「每 5 轮采样查一次」（=5 分钟），实测会漏掉
#        2~3 分钟的短游戏（整段落在两次检测之间）。现在默认 3 分钟。
#   下限 30 秒（写更小的值会被抬到 30）。
RECORDER_GAME_CHECK_SEC=180
# 1 = 降优先级（nice 19 + ionice idle），减少对前台的影响
RECORDER_NICE=1
# 游戏包名（逗号分隔、精确匹配前台包名）；在前台时不记录
#   默认：鸣潮 / 三角洲行动 / 和平精英 / 王者荣耀 / 死亡细胞
RECORDER_GAME_LIST=com.kurogame.mingchao,com.tencent.tmgp.dfm,com.tencent.tmgp.osgame,com.tencent.tmgp.sgame,com.playdigious.deadcells.epic
# ★ 自定义追加包名（1.2.1 新增）—— 想加游戏就在这里加，不用动上面的主名单
#   写法一：一行一个包名，可写多行（推荐，最清楚）
#     RECORDER_GAME_EXTRA=com.example.game1
#     RECORDER_GAME_EXTRA=com.example.game2
#   写法二：一行逗号分隔也行
#     RECORDER_GAME_EXTRA=com.example.game1,com.example.game2
#   支持前缀通配：RECORDER_GAME_EXTRA=com.miHoYo.*  （命中该前缀下所有包）
#   改完重启生效，或执行 /data/adb/modules/mk-addon/apply.sh 后重启记录仪
#   ——本项可重复多行出现，全部累加，无需手动用逗号连接
# RECORDER_GAME_EXTRA=
# 最少采样行数：少于该值的段视为脏段（如部署时的测试残留），归档时直接丢弃
RECORDER_MIN_ROWS=3
# 归档目录（工作区）。段数据在 /data/local/mk-rec，插充电器时复制到这里
RECORDER_ARCH_DIR=/storage/emulated/0/Operit AI/小米17/6.12内核/内核日常记录
# 本地最多保留多少段（超出删最旧；已归档的在工作区，不受影响）
RECORDER_KEEP_SEG=20

# ---- A/B 采样器（调度/性能测试数据自动记录）----
# 注意：1.2.0 起本项默认关闭 —— 已被「内核日常记录仪」(RECORDER_*) 取代。
# 两者功能重叠，同时开启是纯浪费电。需要的场合再手动打开。
# 1 = 开机后自动开始持续采样
# 0 = 不启动（手动：source lib/sampler.sh 后 sampler_ctl start）
SAMPLER_ENABLE=0
# 采样间隔（秒）。默认 60；夜间待机测试可调 300
SAMPLER_INTERVAL=60
# 归档保留天数（默认 7）
SAMPLER_KEEP_DAYS=7