# Ma6302 Kernel Addon - user config
# 改完这个文件后：重启生效，或 su -c /data/adb/modules/mk-addon/apply.sh 立即生效
# 语法：KEY=VALUE   （# 开头为注释；值不要加引号）

# ---- 总开关 ----
MASTER_ENABLE=1

# ---- zram / 压缩算法 ----
ZRAM_ENABLE=1
# 压缩算法： lzo | lzo-rle | lz4 | zstd   （keep=不改）
# 注意：切换算法会 reset zram（丢弃现有 swap 压缩页），有进程被杀风险
ZRAM_ALGO=lz4
# zram 大小（GB）。0 = 保持现状
ZRAM_DISKSIZE_GB=0
# 是否在切换算法时自动 swapoff/swapon（1=是）
ZRAM_REMOUNT_SWAP=1
# reset 后是否自动 mkswap（必须，否则 swapon 失败）
ZRAM_MKSWAP=1

# ---- 小米 zgroup / xswapd / mctrl 研究开关（默认全 0，保持与出厂一致）----
# 详见 逆向-zram回写机制-修正版终稿-20261009.md
# enable 控制【xswapd 主动回写循环】；被动路径（进程退出释放）不受它控制，
# drop_wb 仍会增长。原厂默认 0 = MIUI 上层 extm 主导，内核侧保守关闭。
XSWAPD_ENABLE=0
# 0=不写；>=101 才会让自动回写条件成立
MCTRL_COMP_RATIO=0
# 0=不写；<=100
MCTRL_WB_RATIO=0

# ---- 内存 VM ----
SWAPPINESS=100
VFS_CACHE_PRESSURE=100
COMPACTION_PROACTIVENESS=20
WATERMARK_BOOST_FACTOR=0
EXTFRAG_THRESHOLD=1000
# 0 = 不写（保持 ROM 默认）
DIRTY_RATIO=0

# ---- IO ----
# keep = 不改；或写具体调度器名（none / adios / mq-deadline ...）
IO_SCHEDULER=keep
# 0 = 不改（保持 ROM 默认 = 512，UFS4 下更优）
# 注：Nanally 用 128，但那是它的取舍；我们保持原厂 512 以免降低顺序读性能
READ_AHEAD_KB=0

# ---- 网络（默认关闭）----
NET_TUNE=0

# ---- 数据收集 ----
COLLECT_ON_BOOT=1
COLLECT_DIR=/data/local/mk-data
KEEP_SNAPSHOTS=60